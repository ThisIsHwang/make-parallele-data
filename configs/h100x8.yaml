run:
  out_dir: ./runs/h100x8
  seed: 1234
  log_level: INFO
  log_every: 10000

data:
  madlad_dataset: allenai/madlad-400
  madlad_split: clean
  src_lang: kor
  tgt_lang: eng
  lang_map:
    kor: ko
    eng: en
    jpn: ja
    cmn: zh
  target_examples_total: 10000
  sample_pool_size: 1000000
  streaming: true
  hf_endpoint: null
  hf_timeout_s: 120
  hf_enable_hf_transfer: false

segmentation:
  mode: auto
  min_chars: 20
  max_chars: 5000
  merge_short: true
  allow_html: false

bucketing:
  boundaries: [0, 10, 20, 40, 80, 120, 200, 400, 800, 999999]
  measure: approx_tokens
  per_bucket_quota: auto
  spillover_reservoir: 200000
  tokenizer_name: null

teacher:
  backend: vllm_openai_compatible
  base_url: http://localhost:8000/v1
  api_key_env: VLLM_API_KEY
  model: Qwen/Qwen3-235B-A22B-Instruct-2507
  request_timeout_s: 300
  max_concurrency: 32
  retry:
    max_attempts: 6
    backoff_s: [1, 2, 4, 8, 16, 32]
  unset_proxies_before_request: true
  validation:
    min_chars: 1
    error_substrings: ["traceback", "internal server error", "runtimeerror", "exception", "chat template"]
  generation:
    max_tokens: 512
    top_p: 1.0
    greedy_temperature: 0.0
    sample_temperature: 1.0
    final_temperature: 1.0
    seed: null

prefilter:
  store_translations: false

selection:
  per_bucket: false

final_generation:
  num_candidates: 128
  store_top_k: 1
  strategy: auto
  blob:
    enabled: true
    blob_ratio: 0.5
    blob_max_tokens: 512

metricx:
  backend: official_python
  checkpoint: google/metricx-24-hybrid-xxl-v2p6
  tokenizer: google/mt5-xl
  max_input_length: 1536
  batch_size: 64
  device: cuda
  device_id: null
  cache_db: ./runs/h100x8/metricx_cache.sqlite
  repo_path: ./third_party/metricx
  python_bin: ./.metricx-venv/bin/python
  prompt_template: "source: {source}\nhypothesis: {hypothesis}\nreference: {reference}\nscore:"
  max_new_tokens: 8

filters:
  rule_based: true
  min_chars: 1
  max_chars: 20000
  length_ratio:
    min: 0.25
    max: 4.0
  llm_judge:
    enabled: true
    model: Qwen/Qwen3-235B-A22B-Instruct-2507
    temperature: 0.0
    max_tokens: 128
    fail_policy: conservative

export:
  format: jsonl
  parquet_compression: zstd
